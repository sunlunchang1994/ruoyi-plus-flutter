name: fast
description: "快速开发库"
version: 0.0.1

environment:
  sdk: '>=3.5.0 <4.0.0'

resolution: workspace  # 使用 workspace 统一管理依赖

dependencies:
  flutter:
    sdk: flutter

  # 国际化
  flutter_localizations:
    sdk: flutter

  # 第三方依赖（版本由根 workspace 统一管理）
  #----------------- 版本不要轻易改动  加上是因为上述包也用了这个
  # 基础盒子
  boxes_flutter:
  # 网络请求取消
  dio:
  # 国际化生成代码依赖
  intl:
  #状态管理
  provider:
  #路由
  # go_router: ^14.2.7

  # UI相关---------------------------------------
  #Toast
  fluttertoast:
  #地址：https://github.com/peng8350/flutter_pulltorefresh/blob/master/README_CN.md
  easy_refresh:

  #svg
  #地址：https://pub.flutter-io.cn/packages/flutter_svg
  flutter_svg:

  logger:  #for logging purpose

  # 存储---------------------------------------
  shared_preferences:

  # 其他---------------------------------------
  #权限处理
  permission_handler:
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner:
  flutter_gen_runner:
  flutter_lints:
  #路由
  # go_router_builder: ^2.7.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/fast/images/
