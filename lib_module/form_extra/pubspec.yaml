name: form_extra
description: "表单扩展库"
version: 0.0.1

environment:
  sdk: '>=3.5.0 <4.0.0'

publish_to: none
resolution: workspace  # 使用 workspace 统一管理依赖

dependencies:
  flutter:
    sdk: flutter
  boxes_flutter:
  
  # 第三方依赖（版本由根 workspace 统一管理）
  # 表单---------------------------------------
  # 表单相关
  flutter_form_builder:
  form_builder_extra_fields:
  form_builder_image_picker:
  # form_builder_file_picker: ^4.2.0
  form_builder_validators:
  form_builder_phone_field:
  # form_builder_cupertino_fields: ^0.4.0 ios风格

  # 图片缓存加载
  cached_network_image:
  image_picker:

  # 异步工具
  async:

  # Workspace 内的本地包
  fast:
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner:
  flutter_lints:

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
