name: fast
description: "快速开发库"
version: 0.0.1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 国际化
  flutter_localizations:
    sdk: flutter

  #基础框架
  #boxes_flutter: ^0.4.3
  boxes_flutter:
    git:
      url: https://gitee.com/sunlunchang/boxes-flutter.git

  #----------------- 版本不要轻易改动  加上是因为上述包也用了这个
  #状态管理
  provider: ^6.1.2
  #路由
  # go_router: ^14.2.7

  # UI相关---------------------------------------
  #Toast
  fluttertoast: ^8.2.8
  #地址：https://github.com/peng8350/flutter_pulltorefresh/blob/master/README_CN.md
  easy_refresh: ^3.4.0

  #svg
  #地址：https://pub.flutter-io.cn/packages/flutter_svg
  flutter_svg: ^2.0.10+1

  logger: ^2.3.0  #for logging purpose

  # 存储---------------------------------------
  shared_preferences: ^2.5.2

  # 其他---------------------------------------
  #权限处理
  permission_handler: ^11.4.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  flutter_gen_runner: ^5.10.0

  # 网络相关-------------------------------------
  retrofit_generator: ^8.1.1
  #json_serializable 生成新的命令 flutter pub run build_runner build
  json_serializable: ^6.8.0
  #路由
  # go_router_builder: ^2.7.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true # Add this line
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/fast/images/