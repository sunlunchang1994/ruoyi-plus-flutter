name: biz_main
description: "主业务模块"
version: 0.0.1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  #基础框架
  #boxes_flutter: ^0.4.3
  boxes_flutter:
