name: component
description: "常用组件"
version: 0.0.1

environment:
  sdk: '>=3.5.0 <4.0.0'

resolution: workspace  # 使用 workspace 统一管理依赖

dependencies:
  flutter:
    sdk: flutter

  # 第三方依赖（版本由根 workspace 统一管理）
  # 文件相关---------------------------------------
  # 图片裁剪
  crop_your_image:

  # 特殊的UI组件---------------------------------------
  #WebView
  webview_flutter:

  # 其他---------------------------------------
  #设备信息 会影响编译和冲突，暂不加入
  # device_info_plus: ^11.3.3
  #UUID
  uuid:
  #解决键盘被遮挡
  keyboard_avoider:
  #包信息
  package_info_plus:

  # Workspace 内的本地包
  form_extra:
  base:

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner:
  flutter_gen_runner:
  # 网络相关-------------------------------------
  retrofit_generator:
  #json_serializable 生成新的命令 flutter pub run build_runner build
  json_serializable:

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/mp/
